[package]
name = "mpcwallet-ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "mpcwallet_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
ark = { path = "../crates/ark", features = ["std"] }
ark-core = "0.8"
bitcoin = { version = "0.32", features = ["serde"] }
threshold = { path = "../crates/threshold", features = ["std"] }
k256 = { version = "0.13", features = ["arithmetic", "std"] }
rand = "0.8"
sha2 = "0.10"
libc = "0.2"
enclave-client = { path = "../crates/enclave-client" }
tokio = { version = "1", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
