[package]
name = "enclave-client"
version = "0.1.0"
edition = "2021"
description = "Pure-verification library for AWS Nitro Enclave attestation (COSE_Sign1 / X.509 / NIST P-384 / BIP-340 Schnorr). Callers own HTTP."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
coset = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror = "2"
k256 = { version = "0.13", features = ["schnorr"] }
p384 = { version = "0.13", features = ["ecdsa"] }
x509-cert = { version = "0.2", features = ["std"] }
der = { version = "0.7", features = ["std"] }
ecdsa = { version = "0.16", features = ["verifying"] }
spki = "0.7"

[features]
# Enable tests that need a captured AWS Nitro attestation document at
# tests/fixtures/attestation.b64 (not committed). Capture from a running
# enclave with `curl https://.../enclave/attestation?nonce=deadbeef...`.
fixture-tests = []
