[package]
name = "enclave-client"
version = "0.1.0"
edition = "2021"
description = "Verified HTTP client for AWS Nitro Enclave attestation (forked for FFI)"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
coset = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.9"
thiserror = "2"
k256 = { version = "0.13", features = ["schnorr"] }
p384 = { version = "0.13", features = ["ecdsa"] }
x509-cert = { version = "0.2", features = ["std"] }
der = { version = "0.7", features = ["std"] }
ecdsa = { version = "0.16", features = ["verifying"] }
spki = "0.7"
