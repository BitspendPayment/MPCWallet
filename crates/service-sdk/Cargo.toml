[package]
name = "service-sdk"
version = "0.1.0"
edition = "2021"
description = "Build an always-online Merlin service: enrol a FROST share, co-sign under it, and drive it on a tick."

[dependencies]
threshold = { path = "../threshold", features = ["std"] }
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
axum = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
