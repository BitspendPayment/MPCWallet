[package]
name = "enclave-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
enclave-client = { git = "https://github.com/ArkLabsHQ/introspector-enclave", tag = "v0.0.65" }
tokio = { version = "1", features = ["rt"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
