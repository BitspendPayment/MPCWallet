name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Rust binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ffi/target
            cosigner-runtime/target
          key: e2e-rust-merged-ffi-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: e2e-rust-merged-ffi-

      - name: Build all
        run: |
          cargo build --release --manifest-path ffi/Cargo.toml
          cargo build --release --manifest-path cosigner-runtime/Cargo.toml

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: e2e-binaries
          retention-days: 1
          path: |
            ffi/target/release/libmpcwallet_ffi.so
            cosigner-runtime/target/release/cosigner-runtime


  ark-e2e:
    name: Ark E2E (regtest)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: e2e-binaries

      - name: Make binaries executable
        run: |
          chmod +x cosigner-runtime/target/release/cosigner-runtime

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11.4'

      - name: Install Dart dependencies
        run: cd e2e && dart pub get

      - name: Start Docker services (regtest + Ark)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ark.yml up -d
          echo "Waiting for services to stabilize (30s)..."
          sleep 30

      - name: Initialize Bitcoin chain
        run: ./scripts/bitcoin.sh init

      - name: Initialize arkd
        run: ./scripts/arkd_init.sh --fund

      - name: Run Ark E2E test
        run: cd e2e && dart test test/ark_e2e_test.dart --timeout 600s

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ark.yml down || true
