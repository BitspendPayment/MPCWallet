name: Secret Scan

# Phase 1 security CI — preventive secret scanning with gitleaks.
# NOTE: keys/ is already gitignored and was never committed; the only tracked
# *.pem/*.key files are upstream TEST fixtures under cosigner-runtime/vendor/**,
# which .gitleaks.toml allowlists. This gate exists to stop a real secret from
# being committed in a FUTURE PR. The gitleaks binary is installed directly to
# avoid the org-license requirement of gitleaks-action.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly full-history scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full git history for the scan
      - name: Install gitleaks
        run: |
          VERSION=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: gitleaks detect
        run: gitleaks detect --source . --redact --config .gitleaks.toml --verbose
