[package]
name = "contract-service"
version = "0.1.0"
edition = "2021"

[dependencies]
threshold = { path = "../../crates/threshold", features = ["std"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
rand = "0.8"
sha2 = "0.10"
