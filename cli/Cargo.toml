[package]
name = "merlin-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "merlin"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
anyhow = "1"
rand = "0.8"
dirs = "5"
ed25519-dalek = "2"
base64 = "0.22"
rustyline = "14"

threshold = { path = "../crates/threshold", features = ["std"] }
