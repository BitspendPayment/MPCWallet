[package]
name = "cosigner-runtime"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cosigner-runtime"
path = "src/main.rs"

[features]
default = ["sled-backend"]
sled-backend = ["sled"]
enclave-backend = []

[dependencies]
wasmtime = { version = "45", features = ["component-model", "async"] }
wasmtime-wasi = "45"
wasmtime-wasi-http = "45"
cosigner-proto = { path = "../cosigner-proto" }
# Custom h2 outgoing hook for the guest's wasi:http (the guest speaks gRPC over it).
hyper = { version = "1", features = ["client", "server", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
tonic = "0.12"
tonic-web = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OpenTelemetry
opentelemetry = { version = "0.27", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.27", features = ["trace", "metrics", "logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = [
    "http-proto",
    "reqwest-client",
    "trace",
    "metrics",
    "logs",
] }
tracing-opentelemetry = "0.28"
opentelemetry-appender-tracing = "0.27"
opentelemetry-semantic-conventions = "0.27"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# Persistence
sled = { version = "0.34", optional = true }

# Bitcoin
bitcoin = { version = "0.32", features = ["serde"] }

# Ark protocol
ark = { path = "../crates/ark", features = ["client"] }
reqwest = { version = "0.12", features = ["json"] }

# FCM HTTP v1 OAuth (service-account JWT bearer flow)
jsonwebtoken = "9"

# Streaming
tokio-stream = "0.1"

# Electrum (raw TCP)
tokio-util = { version = "0.7", features = ["codec"] }

# Crypto
sha2 = "0.10"
threshold = { path = "../crates/threshold", features = ["std"] }
parking_lot = "0.12"
k256 = { version = "0.13", features = ["arithmetic"] }
# FutureExt::catch_unwind for actor panic recovery
futures = "0.3"

# HTTP/REST
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Misc
rand = "0.8"
base64 = "0.22"
dashmap = "6"
anyhow = "1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
hex = "0.4"
tonic = "0.12"

[build-dependencies]
tonic-build = "0.12"
