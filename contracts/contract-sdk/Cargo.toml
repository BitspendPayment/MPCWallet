[package]
name = "contract-sdk"
version = "0.1.0"
edition = "2021"
publish = false
description = "no_std runtime glue for Bitcoin WASM contracts (allocator, panic, cabi_realloc)"

# Standalone: consumed as a path dependency by contract crates that target
# wasm32-wasip2. Kept out of any host workspace.
[workspace]

[dependencies]
# Dynamic WASM allocator: grows linear memory on demand (no static arena) and
# supports real free. Bounded at runtime by the host's per-contract memory cap.
talc = "5"

[lib]
