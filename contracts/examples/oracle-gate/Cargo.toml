[package]
name = "oracle-gate"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace: a wasm32-wasip2 contract, kept out of any host workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
contract-sdk = { path = "../../contract-sdk" }
# macros + realloc but NOT async (async pulls futures/once_cell -> std, which
# conflicts with #![no_std]).
wit-bindgen = { version = "0.41", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
