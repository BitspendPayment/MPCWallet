[package]
name = "config-provider"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace: a wasm32-wasip2 config PROVIDER fixture. The cosigner patches its config
# slot (a magic-marked data segment) with the author's blob, then composes it into a template.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
contract-sdk = { path = "../../contract-sdk" }
wit-bindgen = { version = "0.41", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
